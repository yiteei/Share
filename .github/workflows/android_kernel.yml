name: GKI Kernel Build & Publish

on:
  workflow_dispatch:
    inputs:
      kernel_repo:
        description: "Custom kernel repository URL (leave empty to use default hfdem Snapdragon 8 Gen 2 kernel)"
        required: false
        type: string
        default: "https://github.com/hfdem/android_gki_kernel_5.15_common.git"
      kernel_branch:
        description: "Custom kernel branch (leave empty to use android13-5.15-8gen2)"
        required: false
        type: string
        default: "android13-5.15-8gen2"
      build_number:
        description: "Android build ID, appended to kernel version as -ab<number> (e.g. 13729987, leave empty to skip)"
        required: false
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: gki-build-publish
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free disk space
        uses: endersonmenezes/free-disk-space@v3
        with:
          remove_android: true
          remove_dotnet: true
          remove_haskell: true
          remove_tool_cache: true
          remove_swap: true
          remove_packages: "azure-cli google-cloud-cli microsoft-edge-stable google-chrome-stable firefox postgresql* temurin-* *llvm* mysql* dotnet-sdk-*"
          remove_packages_one_command: true
          remove_folders: "/usr/share/swift /usr/share/miniconda /usr/share/az* /usr/local/lib/node_modules /usr/local/share/chromium /usr/local/share/powershell /usr/local/julia /usr/local/aws-cli /usr/local/aws-sam-cli /usr/share/gradle"
          rm_cmd: "rmz"
          rmz_version: "3.1.1"
          testing: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache python3 git curl build-essential libssl-dev bison flex libelf-dev dwarves

      - name: Download Neutron-Clang toolchain
        run: |
          echo "Downloading Neutron-Clang toolchain..."
          mkdir -p "$HOME/toolchains"
          cd "$HOME/toolchains"
          
          # 使用 AntMan 工具下载最新的 Neutron-Clang
          echo "Using AntMan to download Neutron-Clang..."
          bash <(curl -s "https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman") -S
          
          if [ ! -d "neutron-clang" ]; then
            echo "ERROR: Neutron-Clang directory not found after download"
            ls -la
            exit 1
          fi
          
          # 验证工具链
          echo "Verifying toolchain..."
          export PATH="$HOME/toolchains/neutron-clang/bin:$PATH"
          clang --version
          
          # 设置环境变量供后续步骤使用
          echo "CLANG_PATH=$HOME/toolchains/neutron-clang" >> $GITHUB_ENV
          echo "$HOME/toolchains/neutron-clang/bin" >> $GITHUB_PATH
          
          echo "--- Installed toolchain info ---"
          clang --version

      - name: Configure ccache
        run: |
          ccache --version
          ccache --max-size=2G
          ccache --set-config=compression=true
          echo "CCACHE_DIR=$HOME/.ccache" >> $GITHUB_ENV

      - name: Restore ccache cache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: gki-publish-ccache-${{ github.sha }}
          restore-keys: |
            gki-publish-ccache-

      - name: Clone kernel source
        run: |
          REPO="${{ inputs.kernel_repo }}"
          BRANCH="${{ inputs.kernel_branch }}"
          
          # Default values
          [ -z "$REPO" ] && REPO="https://github.com/hfdem/android_gki_kernel_5.15_common.git"
          [ -z "$BRANCH" ] && BRANCH="android13-5.15-8gen2"
          
          echo "Cloning kernel from $REPO @ $BRANCH"
          git clone --depth 1 -b "$BRANCH" "$REPO" kernel-src
          
          # Export for later use
          echo "KERNEL_REPO=$REPO" >> $GITHUB_ENV
          echo "KERNEL_BRANCH=$BRANCH" >> $GITHUB_ENV
          cd kernel-src
          echo "KERNEL_COMMIT=$(git rev-parse HEAD)" >> $GITHUB_ENV

      - name: Extract version info
        working-directory: kernel-src
        run: |
          VER=$(grep '^VERSION = ' Makefile | awk '{print $3}')
          PATCH=$(grep '^PATCHLEVEL = ' Makefile | awk '{print $3}')
          SUB=$(grep '^SUBLEVEL = ' Makefile | awk '{print $3}')
          KERNEL_FULL="${VER}.${PATCH}.${SUB}"
          echo "KERNEL_FULL=$KERNEL_FULL" >> $GITHUB_ENV
          echo "Kernel version: $KERNEL_FULL"

      - name: Set build timestamp
        shell: bash
        run: |
          set -euo pipefail
          DATESTR="$(TZ='UTC' date +'%a %b %d %T %Z %Y')"
          echo "KBUILD_BUILD_TIMESTAMP=$DATESTR" >> "$GITHUB_ENV"
          echo "KBUILD_BUILD_VERSION=1" >> "$GITHUB_ENV"

      - name: Build kernel with make
        working-directory: kernel-src
        env:
          PATH: ${{ env.CLANG_PATH }}/bin:${{ env.PATH }}
        run: |
          set -ex
          
          # Verify toolchain
          echo "Verifying toolchain..."
          clang --version
          clang++ --version
          which clang
          which clang++
          
          # Set BUILD_NUMBER if provided
          if [ -n "${{ inputs.build_number }}" ]; then
            export BUILD_NUMBER="${{ inputs.build_number }}"
            echo "BUILD_NUMBER=$BUILD_NUMBER (will append -ab$BUILD_NUMBER)"
          fi
          
          # Load default config
          make O=out ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- -j$(nproc) defconfig
          
          # Build kernel
          make O=out ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- -j$(nproc) Image
          
          # Verify output
          if [ -f "out/arch/arm64/boot/Image" ]; then
            ls -lh "out/arch/arm64/boot/Image"
            file "out/arch/arm64/boot/Image"
          else
            echo "ERROR: Image not found at out/arch/arm64/boot/Image"
            exit 1
          fi

      - name: Prepare AnyKernel3
        run: |
          git clone https://github.com/WildKernels/AnyKernel3.git -b gki-2.0 --depth 1 AnyKernel3
          rm -rf AnyKernel3/.git
          echo "AnyKernel3 prepared"

      - name: Package kernel artifacts
        run: |
          set -ex
          mkdir -p "$GITHUB_WORKSPACE/publish"
          
          # Copy kernel image
          if [ -f "kernel-src/out/arch/arm64/boot/Image" ]; then
            cp kernel-src/out/arch/arm64/boot/Image "$GITHUB_WORKSPACE/publish/"
            echo "Copied kernel Image"
          fi
          
          # Create AnyKernel3 flashable zip
          cp kernel-src/out/arch/arm64/boot/Image AnyKernel3/Image
          cd AnyKernel3
          zip -r "$GITHUB_WORKSPACE/publish/AnyKernel3-$KERNEL_FULL.zip" ./*
          cd ..
          echo "Created AnyKernel3 zip"
          
          # Create build info
          cat > "$GITHUB_WORKSPACE/publish/BUILD_INFO.txt" << EOF
          Kernel version: $KERNEL_FULL
          Source repo    : $KERNEL_REPO
          Source branch  : $KERNEL_BRANCH
          Source commit  : $KERNEL_COMMIT
          Build time     : $(date -u '+%Y-%m-%d %H:%M:%S UTC')
          Build run      : $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          Toolchain      : Neutron-Clang
          EOF
          
          ls -lh "$GITHUB_WORKSPACE/publish/"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: "kernel-${{ env.KERNEL_FULL }}"
          path: publish/*
          compression-level: 9

      - name: Publish to android_kernel branch
        run: |
          set -e
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # Get original repo and switch to android_kernel branch
          cd "$GITHUB_WORKSPACE"
          git fetch origin android_kernel || true
          if git rev-parse --verify origin/android_kernel >/dev/null 2>&1; then
            git checkout -B android_kernel origin/android_kernel
          else
            git checkout --orphan android_kernel
            git rm -rf . >/dev/null 2>&1 || true
          fi
          
          # Update kernel directory
          mkdir -p "kernel-builds"
          cp -r "$GITHUB_WORKSPACE/publish/"* "kernel-builds/"
          
          git add "kernel-builds"
          if git diff --cached --quiet; then
            echo "No artifact changes, skipping commit"
          else
            git commit -m "Build kernel $KERNEL_FULL
          
          Source: $KERNEL_REPO @ $KERNEL_BRANCH
          Commit: $KERNEL_COMMIT
          CI: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            git push origin android_kernel
            echo "Pushed to android_kernel branch"
          fi
