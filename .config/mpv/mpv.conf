# ──────────────────────────────────────────────────────────────────────
# 界面设置 (OSD/On-Screen Display) - https://mpv.io/manual/stable/#osd
# ──────────────────────────────────────────────────────────────────────
# OSD 是在视频上显示的控制界面和信息叠加层
osc=no # 禁用原生OSC界面，以便使用第三方界面样式（如osc.lua），默认 yes
osd-bar=no # 禁用默认的进度条（在拖动时间轴或调整音量时显示）
title-bar=no # 隐藏操作系统标题栏，使窗口更简洁
osd-on-seek=msg-bar # 跳转时间轴时显示的信息类型：msg-bar=显示消息和进度条
osd-font="LXGW WenKai" # OSD 字体，使用霞鹜文楷字体，默认 sans-serif
osd-playing-msg=${filename} # 开始播放每个文件时短暂显示文件名

# ──────────────────────────────────────────────────────────────────────
# 稍后观看功能 - https://mpv.io/manual/master/#watch-later
# ──────────────────────────────────────────────────────────────────────
# 自动保存和恢复播放位置
save-position-on-quit=yes # 退出时自动保存播放位置，下次打开从相同位置继续
watch-later-options=start,sid # 保存播放位置和字幕轨道选择

# ──────────────────────────────────────────────────────────────────────
# 窗口设置 - https://mpv.io/manual/stable/#window
# ──────────────────────────────────────────────────────────────────────
keep-open=yes # 播放完文件后保持窗口打开（暂停状态），而不是自动关闭
border=no # 无边框窗口，更简洁的界面
auto-window-resize=no # 自动调整窗口大小
geometry=50%x50% # 窗口初始大小为屏幕的50%宽度和50%高度
keepaspect=yes # 保持视频宽高比，防止拉伸变形

# ──────────────────────────────────────────────────────────────────────
# 终端输出设置 - https://mpv.io/manual/stable/#terminal
# ──────────────────────────────────────────────────────────────────────
# 控制mpv在终端中的日志输出格式
msg-color=yes # 在终端中使用彩色显示日志消息，便于区分不同类型的信息
msg-module=yes # 在日志消息前添加模块名称，便于调试和追踪问题来源

# ──────────────────────────────────────────────────────────────────────
# 播放列表设置 - https://mpv.io/manual/master/#options-prefetch-playlist
# ──────────────────────────────────────────────────────────────────────
directory-mode=ignore # 忽略子目录，只播放当前目录的文件
autocreate-playlist=filter # 自动将目录中的其他文件添加到播放列表
directory-filter-types=video,audio # 只过滤视频和音频文件（排除图片等）
watch-later-options=start,vid,aid,sid # 保存播放位置、视频轨道、音频轨道和字幕轨道
reset-on-next-file=pause,loop-file,brightness,contrast,gamma,saturation,hue,vf,af # 切换文件时重置这些设置

# ──────────────────────────────────────────────────────────────────────
# YouTube/网络视频设置 - https://mpv.io/manual/master/#options-ytdl-format
# ──────────────────────────────────────────────────────────────────────
# 使用youtube-dl下载和播放在线视频
ytdl-format=bestvideo+bestaudio/best # 选择最佳视频+最佳音频组合，或直接选择最佳格式
# ytdl-format=bestvideo[height<=?1080][vcodec^=avc1]+bestaudio/best # 限制为1080p H.264编码，降低CPU使用率
hls-bitrate=max # 对于HLS流媒体，选择最高比特率的版本
ytdl-raw-options-append=yes-playlist= # 启用播放列表支持
ytdl-raw-options-append=write-subs= # 下载字幕
ytdl-raw-options-append=sub-langs=all,-danmaku # 下载所有语言的字幕，排除弹幕

# ──────────────────────────────────────────────────────────────────────
# 视频设置 - https://mpv.io/manual/stable/#video
# ──────────────────────────────────────────────────────────────────────
# 视频渲染和硬件加速设置，决定使用CPU还是GPU进行视频处理
vo=gpu-next
gpu-context=waylandvk
hwdec=vaapi-copy,vaapi # 启用VA-API硬件解码（Video Acceleration API），降低CPU使用率
hwdec-codecs=all # 对所有支持的编解码器使用硬件解码
profile=high-quality # 应用高质量视频配置文件

# 缓存设置
cache=yes # 启用网络缓存，将数据预加载到内存中，减少缓冲
demuxer-max-bytes=500MiB # 解复用器最大缓存大小：500MB，默认150MB
demuxer-hysteresis-secs=10 # 缓存滞后时间：10秒，减少不必要的缓存填充以节省功耗

# ──────────────────────────────────────────────────────────────────────
# 音频设置 - https://mpv.io/manual/stable/#audio
# ──────────────────────────────────────────────────────────────────────
# 注意：Windows系统的"音频增强"设置可能会破坏环绕声的下采样，
# 禁用该选项可以解决此问题
audio-file-auto=fuzzy # 自动加载与视频文件同名的外部音频文件（模糊匹配）
volume-max=100 # 最大音量限制为100%，默认130%（130%的音量约为100%的两倍，因为1.3^3≈2）
alang=jpn,ja,ko,eng,en,enUS,en-US # 音频语言优先级：日语、韩语、英语

# ──────────────────────────────────────────────────────────────────────
# 字幕设置 - https://mpv.io/manual/stable/#subtitles
# ──────────────────────────────────────────────────────────────────────
sub-auto=fuzzy # 自动加载与视频文件同名的外部字幕文件（模糊匹配）
slang=zh-hans,zh-cn,zh-hans-cn,zh-sg,zh-hans-sg,sc,chs,zh-hant,zh-hk,zh-hant-hk,zh-mo,zh-hant-mo,zh-tw,zh-hant-tw,tc,cht,zh,zho,chi,en,eng,ja,jpn # 字幕语言优先级：简体中文、繁体中文、英语、日语
sub-ass-override=force # 强制覆盖ASS字幕的样式，移除自定义字体（个人偏好）
# secondary-sub-ass-override=yes # 启用第二字幕的ASS样式覆盖（已注释）
sub-use-margins=no # 字幕不显示在黑边区域，保持在视频画面内
sub-font="LXGW WenKai" # 字幕字体：霞鹜文楷，默认 sans-serif

# 字幕样式设置
sub-font-size=32 # 字幕字体大小：32像素，使用font-size而不是scale避免破坏某些字幕
sub-border-size=2 # 字幕边框大小：2像素，提高可读性
sub-back-color=000000 # 字幕背景颜色：黑色（十六进制RGB）
sub-shadow-offset=1 # 字幕阴影偏移：1像素，增加立体感
secondary-sub-pos=6 # 第二字幕位置：从屏幕顶部向下偏移6%，用于detectdualsubs.lua脚本

# ──────────────────────────────────────────────────────────────────────
# 配置文件 - https://mpv.io/manual/stable/#profiles
# ──────────────────────────────────────────────────────────────────────
# 配置文件允许根据不同的条件应用不同的设置
# ──────────────────────────────────────────────────────────────────────

# 视频文件配置文件
# 条件：有视频编解码器且帧率大于1（即视频文件）
[video]
profile-cond=video_codec and (container_fps > 1)
geometry=50%x50% # 视频文件窗口大小为屏幕的50%
# sub-font="Segoe UI Semibold" # 视频文件的字幕字体（已注释）

# 音频文件配置文件
# 条件：有音频编解码器且没有帧率或帧率为1（即纯音频文件）
[audio]
profile-cond=audio_codec and (container_fps == nil or container_fps == 1)
sub-font="LXGW WenKai" # 音频文件的字幕字体（如果有歌词等字幕）
